name: Build Customer Manager APK

on:
  push:
    branches: [main]
    paths:
      - 'CustomerManager_AndroidStudio.zip'
      - 'src/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9 (wrapper is absent in source ZIP)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK command line tools
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify and extract source ZIP
        run: |
          set -e
          test -f CustomerManager_AndroidStudio.zip
          unzip -t CustomerManager_AndroidStudio.zip
          mkdir source
          unzip -q CustomerManager_AndroidStudio.zip -d source

      - name: Build updated web app and apply Android Back handling
        run: |
          set -e
          SETTINGS="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          # Keep the repository's editable React source as the single source of truth.
          cp -R "$GITHUB_WORKSPACE/src/." "$PROJECT_DIR/web-source/src/"
          cp "$GITHUB_WORKSPACE/tsconfig.json" "$PROJECT_DIR/web-source/tsconfig.json"
          cp "$GITHUB_WORKSPACE/package.json" "$PROJECT_DIR/web-source/package.json"
          cd "$PROJECT_DIR/web-source"
          npm install --no-audit --no-fund
          npm run build
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          rm -rf "$PROJECT_DIR/app/src/main/assets/"*
          cp -R dist/. "$PROJECT_DIR/app/src/main/assets/"
          # WebView Back now first asks the React UI to close its active screen/dialog.
          python3 - "$PROJECT_DIR/app/src/main/java/com/customermanager/app/MainActivity.kt" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          source = p.read_text()
          source = source.replace("val granted = results.values.any { it }", "val granted = results.isNotEmpty() && results.values.all { it }", 1)
          start = source.index("        onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {")
          end = source.index("\n\n        // Loads local bundled assets", start)
          new = '''        onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
              override fun handleOnBackPressed() {
                  webView.evaluateJavascript(
                      "(function(){var e=new Event('androidback',{cancelable:true});window.dispatchEvent(e);return e.defaultPrevented;})()"
                  ) { handled ->
                      if (handled == "true") return@evaluateJavascript
                      if (webView.canGoBack()) webView.goBack() else {
                          isEnabled = false
                          onBackPressedDispatcher.onBackPressed()
                      }
                  }
              }
          })'''
          source = source[:start] + new + source[end:]
          p.write_text(source)
          PY

      - name: Integrate Google ML Kit Document Scanner
        run: |
          set -e
          SETTINGS="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle.kts -print -quit)"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          APP_DIR="$PROJECT_DIR/app"
          python3 - "$APP_DIR" <<'PY'
          from pathlib import Path
          import sys

          app = Path(sys.argv[1])
          gradle = app / "build.gradle.kts"
          text = gradle.read_text()
          dependency = '    implementation("com.google.android.gms:play-services-mlkit-document-scanner:16.0.0")'
          if "play-services-mlkit-document-scanner" not in text:
              if "dependencies {" not in text:
                  raise SystemExit("Could not find app dependencies block")
              text = text.replace("dependencies {", "dependencies {\n" + dependency, 1)
              gradle.write_text(text)

          main = app / "src/main/java/com/customermanager/app/MainActivity.kt"
          source = main.read_text()
          imports = [
              "import androidx.activity.result.IntentSenderRequest",
              "import com.google.mlkit.vision.documentscanner.GmsDocumentScanning",
              "import com.google.mlkit.vision.documentscanner.GmsDocumentScannerOptions",
              "import com.google.mlkit.vision.documentscanner.GmsDocumentScanningResult",
              "import com.google.mlkit.vision.documentscanner.GmsDocumentScannerOptions.RESULT_FORMAT_PDF",
              "import com.google.mlkit.vision.documentscanner.GmsDocumentScannerOptions.SCANNER_MODE_FULL",
              "import org.json.JSONObject",
          ]
          marker = "import androidx.activity.result.contract.ActivityResultContracts\n"
          if marker not in source:
              raise SystemExit("Could not find ActivityResultContracts import")
          for item in imports:
              if item not in source:
                  source = source.replace(marker, marker + item + "\n", 1)

          launcher_marker = "    @SuppressLint(\"SetJavaScriptEnabled\")"
          launcher = '''
              private val documentScannerLauncher =
                  registerForActivityResult(ActivityResultContracts.StartIntentSenderForResult()) { result ->
                      if (result.resultCode == RESULT_OK) {
                          try {
                              val scan = result.data?.let { GmsDocumentScanningResult.fromActivityResultIntent(it) }
                                  ?: throw IllegalStateException("Google Scanner returned no result")
                              val pdf = scan.pdf ?: throw IllegalStateException("No PDF was returned by Google Scanner")
                              val bytes = contentResolver.openInputStream(pdf.uri)?.use { it.readBytes() }
                                  ?: throw IllegalStateException("Could not read scanned PDF")
                              val detail = JSONObject()
                                  .put("pdfBase64", Base64.encodeToString(bytes, Base64.NO_WRAP))
                                  .put("pageCount", pdf.pageCount)
                                  .put("fileName", "Scanned_Document_${System.currentTimeMillis()}.pdf")
                              dispatchDocumentScannerEvent("nativeDocumentScanResult", detail)
                          } catch (error: Exception) {
                              dispatchDocumentScannerError(error.message ?: "Could not read scanned document")
                          }
                      } else {
                          dispatchDocumentScannerEvent("nativeDocumentScanCancelled")
                      }
                  }

              private fun launchDocumentScanner() {
                  val options = GmsDocumentScannerOptions.Builder()
                      .setGalleryImportAllowed(true)
                      .setPageLimit(50)
                      .setResultFormats(RESULT_FORMAT_PDF)
                      .setScannerMode(SCANNER_MODE_FULL)
                      .build()
                  GmsDocumentScanning.getClient(options)
                      .getStartScanIntent(this)
                      .addOnSuccessListener { intentSender ->
                          documentScannerLauncher.launch(IntentSenderRequest.Builder(intentSender).build())
                      }
                      .addOnFailureListener { error ->
                          dispatchDocumentScannerError(error.message ?: "Google Document Scanner could not start")
                      }
              }

              private fun dispatchDocumentScannerEvent(name: String, detail: JSONObject? = null) {
                  val script = if (detail == null) {
                      "window.dispatchEvent(new Event('$name'))"
                  } else {
                      "window.dispatchEvent(new CustomEvent('$name',{detail:$detail}))"
                  }
                  runOnUiThread {
                      if (::webView.isInitialized) webView.evaluateJavascript(script, null)
                  }
              }

              private fun dispatchDocumentScannerError(message: String) {
                  dispatchDocumentScannerEvent(
                      "nativeDocumentScanResult",
                      JSONObject().put("error", message)
                  )
              }

              inner class AndroidDocumentScanner {
                  @JavascriptInterface
                  fun startDocumentScan() {
                      runOnUiThread { launchDocumentScanner() }
                  }
              }

          '''
          if "private val documentScannerLauncher" not in source:
              if launcher_marker not in source:
                  raise SystemExit("Could not find MainActivity insertion point for scanner launcher")
              source = source.replace(launcher_marker, launcher + launcher_marker, 1)

          bridge_marker = '            addJavascriptInterface(AndroidDownloader(), "AndroidDownloader")'
          bridge = bridge_marker + '\n            addJavascriptInterface(AndroidDocumentScanner(), "AndroidDocumentScanner")'
          if 'addJavascriptInterface(AndroidDocumentScanner(), "AndroidDocumentScanner")' not in source:
              if bridge_marker not in source:
                  raise SystemExit("Could not find WebView JavaScript bridge insertion point")
              source = source.replace(bridge_marker, bridge, 1)

          # Add native exit confirmation bridge and runtime WebView geolocation permission flow.
          imports = [
              "import android.Manifest",
              "import android.webkit.GeolocationPermissions",
              "import android.webkit.WebChromeClient",
          ]
          marker = "import androidx.activity.result.contract.ActivityResultContracts\n"
          if marker not in source:
              raise SystemExit("Could not find ActivityResultContracts import for location permission launcher")
          for item in imports:
              if item not in source:
                  source = source.replace(marker, marker + item + "\n", 1)

          if "private val geolocationPermissionLauncher" not in source:
              geo_properties = '''
              private var pendingGeolocationOrigin: String? = null
              private var pendingGeolocationCallback: GeolocationPermissions.Callback? = null
              private val geolocationPermissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { results ->
                      val allowed = results[Manifest.permission.ACCESS_FINE_LOCATION] == true ||
                          results[Manifest.permission.ACCESS_COARSE_LOCATION] == true
                      pendingGeolocationCallback?.invoke(pendingGeolocationOrigin, allowed, false)
                      pendingGeolocationOrigin = null
                      pendingGeolocationCallback = null
                  }

              inner class AndroidApp {
                  @JavascriptInterface
                  fun exitApp() {
                      runOnUiThread { finishAffinity() }
                  }
              }

          '''
              if launcher_marker not in source:
                  raise SystemExit("Could not find MainActivity property insertion point for location/exit bridges")
              source = source.replace(launcher_marker, geo_properties + launcher_marker, 1)

          geo_override = '''
                      override fun onGeolocationPermissionsShowPrompt(
                          origin: String?,
                          callback: GeolocationPermissions.Callback?
                      ) {
                          val fineGranted = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) ==
                              android.content.pm.PackageManager.PERMISSION_GRANTED
                          val coarseGranted = checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) ==
                              android.content.pm.PackageManager.PERMISSION_GRANTED
                          if (fineGranted || coarseGranted) {
                              callback?.invoke(origin, true, false)
                          } else {
                              pendingGeolocationOrigin = origin
                              pendingGeolocationCallback = callback
                              geolocationPermissionLauncher.launch(
                                  arrayOf(
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                                  )
                              )
                          }
                      }

          '''
          import re
          chrome = re.search(r'((?:webView\.)?webChromeClient\s*=\s*object\s*:\s*WebChromeClient[(][)]\s*[{])', source)
          if not chrome:
              raise SystemExit("Could not locate the existing WebChromeClient object for geolocation permission handling")
          if "webView.settings.setGeolocationEnabled(true)" not in source:
              source = source[:chrome.start()] + "webView.settings.setGeolocationEnabled(true)\n            " + source[chrome.start():]
              chrome = re.search(r'((?:webView\.)?webChromeClient\s*=\s*object\s*:\s*WebChromeClient[(][)]\s*[{])', source)
          if "override fun onGeolocationPermissionsShowPrompt" not in source:
              source = source[:chrome.end()] + "\n" + geo_override + source[chrome.end():]

          # Register only foreground location access; do not request location at app launch.
          manifest = app / "src/main/AndroidManifest.xml"
          manifest_text = manifest.read_text()
          if "android.permission.ACCESS_FINE_LOCATION" not in manifest_text:
              manifest_text = manifest_text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
                  '<application',
                  1
              )
              manifest.write_text(manifest_text)

          bridge_marker = '            addJavascriptInterface(AndroidDocumentScanner(), "AndroidDocumentScanner")'
          app_bridge = bridge_marker + '\n            addJavascriptInterface(AndroidApp(), "AndroidApp")'
          if 'addJavascriptInterface(AndroidApp(), "AndroidApp")' not in source:
              if bridge_marker not in source:
                  raise SystemExit("Could not find JavaScript bridge insertion point for app exit")
              source = source.replace(bridge_marker, app_bridge, 1)

          main.write_text(source)
          PY

      - name: Locate Gradle project and build APK
        run: |
          set -e
          SETTINGS="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts was not found in the extracted ZIP."
            find "$GITHUB_WORKSPACE/source" -maxdepth 5 -type f | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          cd "$PROJECT_DIR"
          echo "Gradle project: $PROJECT_DIR"
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomerManager-debug-APK
          path: |
            source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
