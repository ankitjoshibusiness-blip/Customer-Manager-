name: Build Customer Manager APK

on:
  push:
    branches: [main]
    paths:
      - 'CustomerManager_AndroidStudio.zip'
      - 'src/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9 (wrapper is absent in source ZIP)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK command line tools
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify and extract source ZIP
        run: |
          set -e
          test -f CustomerManager_AndroidStudio.zip
          unzip -t CustomerManager_AndroidStudio.zip
          mkdir source
          unzip -q CustomerManager_AndroidStudio.zip -d source

      - name: Build updated web app and apply Android Back handling
        run: |
          set -e
          SETTINGS="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          # Keep the repository's editable React source as the single source of truth.
          cp -R "$GITHUB_WORKSPACE/src/." "$PROJECT_DIR/web-source/src/"
          cd "$PROJECT_DIR/web-source"
          npm install --no-audit --no-fund
          npm run build
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          rm -rf "$PROJECT_DIR/app/src/main/assets/"*
          cp -R dist/. "$PROJECT_DIR/app/src/main/assets/"
          # WebView Back now first asks the React UI to close its active screen/dialog.
          python3 - "$PROJECT_DIR/app/src/main/java/com/customermanager/app/MainActivity.kt" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          source = p.read_text()
          source = source.replace("val granted = results.values.any { it }", "val granted = results.isNotEmpty() && results.values.all { it }", 1)
          start = source.index("        onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {")
          end = source.index("\n\n        // Loads local bundled assets", start)
          new = '''        onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
              override fun handleOnBackPressed() {
                  webView.evaluateJavascript(
                      "(function(){var e=new Event('androidback',{cancelable:true});window.dispatchEvent(e);return e.defaultPrevented;})()"
                  ) { handled ->
                      if (handled == "true") return@evaluateJavascript
                      if (webView.canGoBack()) webView.goBack() else {
                          isEnabled = false
                          onBackPressedDispatcher.onBackPressed()
                      }
                  }
              }
          })'''
          source = source[:start] + new + source[end:]
          p.write_text(source)
          PY

      - name: Locate Gradle project and build APK
        run: |
          set -e
          SETTINGS="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts was not found in the extracted ZIP."
            find "$GITHUB_WORKSPACE/source" -maxdepth 5 -type f | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          cd "$PROJECT_DIR"
          echo "Gradle project: $PROJECT_DIR"
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomerManager-debug-APK
          path: |
            source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
