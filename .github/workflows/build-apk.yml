name: Build Customer Manager APK

on:
  push:
    branches: [main]
    paths:
      - 'CustomerManager_AndroidStudio.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify and extract source ZIP
        run: |
          test -f CustomerManager_AndroidStudio.zip
          unzip -t CustomerManager_AndroidStudio.zip
          mkdir source
          unzip -q CustomerManager_AndroidStudio.zip -d source

      - name: Locate Gradle project and build APK
        run: |
          set -e
          WRAPPER="$(find "$GITHUB_WORKSPACE/source" -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::Gradle wrapper (gradlew) was not found in the uploaded ZIP."
            echo "Top-level extracted files:"
            find "$GITHUB_WORKSPACE/source" -maxdepth 4 -type f | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomerManager-debug-APK
          path: |
            source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
